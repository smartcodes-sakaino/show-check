<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>show-check</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <h1>show-check</h1>
    <p class="sub">SHOWROOM ギフト自動起票ツール</p>

    <section id="login" class="card">
      <h2>合言葉を入力</h2>
      <input id="tokenInput" type="password" placeholder="ADMIN_TOKEN" autocomplete="off" />
      <button id="loginBtn">ログイン</button>
      <p id="loginError" class="error"></p>
    </section>

    <section id="app" class="hidden">
      <section class="card">
        <h2>状態</h2>
        <div class="status-row">
          <span id="statusBadge" class="badge">-</span>
          <span id="monitoringBadge" class="badge">-</span>
        </div>
        <p>対象ルーム: <span id="roomLabel">未設定</span></p>
        <p class="muted">最終チェック: <span id="lastChecked">-</span></p>
        <p id="lastError" class="error"></p>
        <div class="btn-row">
          <button id="startBtn">監視を開始</button>
          <button id="stopBtn" class="secondary">監視を停止</button>
        </div>
      </section>

      <section class="card">
        <h2>監視対象ルームの設定</h2>
        <select id="roomPresetSelect">
          <option value="">よく使うルームから選択…</option>
          <option value="https://www.showroom-live.com/r/JOY_JURII_AIDA">逢田 珠里依</option>
          <option value="https://www.showroom-live.com/r/JOY_KONOA_AMANO">天野 香乃愛</option>
          <option value="https://www.showroom-live.com/r/JOY_AYUMI_ICHIHARA">市原 愛弓</option>
          <option value="https://www.showroom-live.com/r/JOY_RENON_ESUMI">江角 怜音</option>
          <option value="https://www.showroom-live.com/r/JOY_MITSUKI_OSHIDA">大信田 美月</option>
          <option value="https://www.showroom-live.com/r/JOY_AOI_ONISHI">大西 葵</option>
          <option value="https://www.showroom-live.com/r/JOY_OZAWA_AIMI">小澤 愛実</option>
          <option value="https://www.showroom-live.com/r/JOY_MAI_TAKAHASHI">髙橋 舞</option>
          <option value="https://www.showroom-live.com/r/JOY_RIKO_FUJISAWA">藤沢 莉子</option>
          <option value="https://www.showroom-live.com/r/JOY_YUUKA_MURAYAMA">村山 結香</option>
          <option value="https://www.showroom-live.com/r/JOY_MOMOKA_YAMADA">山田 杏佳</option>
          <option value="https://www.showroom-live.com/r/JOY_ARISU_YAMANO">山野 愛月</option>
        </select>
        <input id="roomInput" type="text" placeholder="ルームURL または room_id" />
        <button id="saveRoomBtn">保存</button>
        <p id="roomError" class="error"></p>
      </section>

      <section class="card">
        <h2>直近のギフトログ</h2>
        <button id="refreshBtn" class="secondary">更新</button>
        <button id="clearGiftLogBtn" class="secondary">クリア</button>
        <ul id="giftList" class="gift-list"></ul>
      </section>

      <section class="card">
        <h2>履歴・集計</h2>
        <select id="historyDateSelect">
          <option value="">日付を選択…</option>
        </select>
        <p id="historyError" class="error"></p>
        <div id="historyResult" class="hidden">
          <p class="muted">合計: <span id="historyGrandTotal">0</span>G</p>
          <button id="copyHistoryBtn" class="secondary">コピー用テキストをコピー</button>
          <p id="copyHistoryStatus" class="muted"></p>
          <ul id="historyList" class="gift-list"></ul>
          <textarea id="historyCopyText" class="hidden" readonly></textarea>
        </div>
      </section>

      <button id="logoutBtn" class="link">合言葉をリセット</button>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
